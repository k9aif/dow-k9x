# ----------------------------------------------------------
# DoDAF → DOW V3 Orchestrator Stage Mapping
# ----------------------------------------------------------
version: 3.0
description: |
  Defines the official DoDAF 2.0 → DOW V3 mapping.
  Used by the Principal Orchestrator to sequence:
  - Stage 1 (Validation & Intake)
  - Parallel Stages 2–5 (ICD, Capability, Architecture, Requirements)
  - Stage 6 (Presentation & Reporting)

stages:
  - id: 1
    name: "Validation & Intake Process"
    dodaf_stage: "Intake Validation"
    description: "Document readiness, metadata validation, schema alignment."
    dodaf_views: ["AV-1"]
    orchestrator_stage: "stage1_intent_crew.yaml"
    stop_after: false
    next_stage: [2,3,4,5]   # Parallel fork after Stage 1

  - id: 2
    name: "Needs Analysis Process (ICD)"
    dodaf_stage: "ICD Development"
    description: "Pain points, mission analysis, objectives, ICD generation."
    dodaf_views: ["CV-1", "OV-1", "OV-5"]
    orchestrator_stage: "stage2_scope_crew.yaml"
    stop_after: false
    next_stage: 6

  - id: 3
    name: "Capability Analysis Process"
    dodaf_stage: "Capability Analysis"
    description: "Capability extraction, AoA, maturity assessment."
    dodaf_views: ["CV-2", "CV-3", "CV-6"]
    orchestrator_stage: "stage3_datarequirements_crew.yaml"
    stop_after: false
    next_stage: 6

  - id: 4
    name: "Architecture Development Process"
    dodaf_stage: "Architecture Development"
    description: "OV/SV/SvcV/TV integration, interface mapping, standards alignment."
    dodaf_views: ["OV-2", "OV-6", "SV-1", "SvcV-1", "TV-1"]
    orchestrator_stage: "stage4_datacorrelation_crew.yaml"
    stop_after: false
    next_stage: 6

  - id: 5
    name: "Requirements Consolidation Process"
    dodaf_stage: "Requirements & V&V"
    description: "Traceability, verification criteria, requirements consolidation."
    dodaf_views: ["SV-5", "OV-7", "TV-1"]
    orchestrator_stage: "stage5_analysis_crew.yaml"
    stop_after: false
    next_stage: 6

  - id: 6
    name: "Presentation & Reporting Process"
    dodaf_stage: "Governance Presentation"
    description: "Final summaries, JROC-ready bundles, baselines, sign-off."
    dodaf_views: ["AV-1", "AV-2", "CV-6"]
    orchestrator_stage: "stage6_presentation_crew.yaml"
    stop_after: true