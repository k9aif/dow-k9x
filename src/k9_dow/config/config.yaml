# K9-AIF Standard Config — DoW Architecture Workbench

inference:
  # OLLAMA_MODEL (.env) sets the model for every DAS agent alias below;
  # OLLAMA_NUM_CTX (.env) sets their context window (config/runtime.py)
  # (default qwen3.8:27b) -- the same variable the UI badge (/llm) and the
  # ICD footer report, so all three always agree. think: false -- qwen3.x is a hybrid reasoning
  # model and can return an empty answer if its thinking budget runs out.
  llm_factory:
    backend: ollama
    provider: ollama
    base_url: "${OLLAMA_HOST:-http://localhost:11434}"
    models:
      general:
        model: "${OLLAMA_MODEL:-qwen3.8:27b}"
        think: false
        temperature: 0.3
        max_tokens: 4096
      reasoning:
        model: "${OLLAMA_MODEL:-qwen3.8:27b}"
        think: false
        temperature: 0.2
        max_tokens: 4096
      # PackageBuilderAgent restates/consolidates every prior agent's full
      # output (readiness assessment, gap analysis, evidence summary, all
      # in prose) into one final package -- a genuinely larger synthesis
      # task than the rest of the "reasoning" alias's callers. Sharing the
      # same 4096-token ceiling truncated it mid-sentence in the final
      # deliverable handed to the human decision authority (confirmed
      # 2026-09-03 in a real FIREBIRD run). A dedicated alias with more
      # headroom on both output length and context window (its prompt is
      # also the largest of any agent's, containing the full upstream
      # payload) avoids raising the ceiling for every other reasoning call.
      package_synthesis:
        model: "${OLLAMA_MODEL:-qwen3.8:27b}"
        think: false
        temperature: 0.2
        max_tokens: 8192
        # num_ctx for every agent alias comes from OLLAMA_NUM_CTX (.env, default
        # 32768; config/runtime.py). This step's input (everything upstream)
        # measured 15.3k-19.5k Qwen tokens on three real JCIDS runs (2026-10-03);
        # at the old fixed 16384 Ollama kept only the last 8,194 of 19,517 input
        # tokens -- silently, no error.
      # Independent grader for generated documents (a different model family
      # from the generator, so a model does not grade its own work).
      judge:
        model: "${GRADER_MODEL:-deepseek-r1:32b}"
        temperature: 0.0
        max_tokens: 6144
        num_ctx: 32768
      guardian:
        model: "${DAS_GUARDIAN_MODEL:-granite4.1-guardian:8b}"
        temperature: 0.0
        max_tokens: 32

  router:
    type: k9_model_router
    default_model: general
    persistence:
      enabled: true
      provider: postgres

  model_catalog:
    default_model: general
    models:
      general:
        provider: ollama
        llm_ref: general
        capabilities: [general, chat, summarization]
        latency_tier: realtime
        cost_tier: minimal
      reasoning:
        provider: ollama
        llm_ref: reasoning
        capabilities: [reasoning, analysis, extraction]
        latency_tier: interactive
        cost_tier: standard
      package_synthesis:
        provider: ollama
        llm_ref: package_synthesis
        capabilities: [package_synthesis]
        latency_tier: batch
        cost_tier: standard
      judge:
        provider: ollama
        llm_ref: judge
        capabilities: [judge]
        latency_tier: batch
        cost_tier: standard
      guardian:
        provider: ollama
        llm_ref: guardian
        capabilities: [guardrails]
        latency_tier: interactive
        cost_tier: minimal

postgres:
  host: "${POSTGRES_HOST:-localhost}"
  port: 5432
  user: "${POSTGRES_USER:-postgres}"
  password: "${K9_PG_PASSWORD:-postgres}"
  database: "${POSTGRES_DB:-dow}"
  schema: "dow"
  echo: false

# Knowledge-corpus retrieval backend for K9Retriever (ViewGeneratorAgent).
# Without this section, K9Retriever has no VectorDB configured and its
# retrieve() calls return nothing (see view_generator_agent.py's fallback
# fix) -- this deployment seeds it with a synthetic, non-sensitive corpus
# only (prior-CDD excerpts, DoDAF reference-architecture guidance,
# acquisition review-package guidance); no real DoD data is stored here.
# See data/synthetic_corpus/README.md and experiments/seed_synthetic_corpus.py.
vectordb:
  provider: pgvector
  embedding_provider: ollama
  embedding_model: nomic-embed-text
  embedding_endpoint: "${OLLAMA_HOST:-http://localhost:11434}"
  dimension: 768
  table: dow_knowledge_corpus

# Real Guardian-backed governance (orchestrator-level, not per-agent --
# see project_k9aif_architecture_facts memory, 2026-09-03 decision, for
# why: touching all 17 agents or the shared BaseSquad framework class
# was rejected as too broad a change this close to submission).
# GuardianGovernance.post_process() reviews the assembled JCIDS package
# content via the guardian model above; the verdict is attached to the
# result for the human JROC reviewer to see, not used to auto-block the
# pipeline -- consistent with DAS's own "AI recommends, human decides"
# design throughout. enabled: false falls back to NoopGovernance exactly
# as before (K9_ENV=development, no behavior change for anyone not
# opting in).
governance:
  enabled: true
  model_alias: guardian

# k9x_Shield for every DAS agent. With k9-aif >= 1.15 (governance by
# construction) BaseAgent builds ShieldGovernance from this block and runs it
# around every agent's execute(); on earlier versions it is inert.
# Profile verified 2026-10-02 by replaying 51 real agent steps from three
# jobs (JOB-20261002-667CC0 / -49169D / -3C5946): 0 false blocks; a prompt
# injection inside a document is blocked.
# - InputSizeCheck 250k: later agents receive earlier agents' results
#   (a JCIDS result is ~62 KB); the 32k framework default blocked them.
# - Egress PII only: DAS agents call no tools, and the tool-oriented egress
#   checks misfired on DoDAF output (SemanticDriftCheck "loop trap" on
#   repetitive tables x3, ToolArgumentCheck "SQL injection" on view text x1).
security:
  shield:
    enabled: true
    strict: false
    fail_open: true
    ingress:
      checks: [InputSizeCheck, PromptInjectionCheck, PIIBoundaryCheck]
    egress:
      checks: [PIIBoundaryCheck]
    check_config:
      InputSizeCheck:
        max_chars: 250000
  # Screen for the submitted document at JCIDS stage entry (stricter than the
  # per-agent profile above): personal data such as an SSN BLOCKS here.
  # Not used inside agents, whose inputs include generated text where the PII
  # patterns (e.g. any 5-digit number as a ZIP code) would misfire. All four
  # demo documents pass this screen (checked 2026-10-03).
  document_screen:
    enabled: true
    strict: false
    fail_open: false
    ingress:
      checks: [InputSizeCheck, PromptInjectionCheck, PIIBoundaryCheck]
    egress:
      checks: []
    check_config:
      InputSizeCheck:
        max_chars: 250000
      PIIBoundaryCheck:
        block_on_match: true

  # Classification screen at JCIDS stage entry (security/classification_marking_check.py):
  # DAS is an UNCLASSIFIED proof of concept, so documents marked above UNCLASSIFIED
  # (banner, portion marking, NOFORN/ORCON/REL TO...) are refused before any model
  # call. CUI is flagged; block_cui: true blocks it.
  classification:
    enabled: true
    block_cui: false

# Systems Engineering stage (reached after the PATHWAY-MILESTONE approval).
# demo_stub: true = demonstration endpoint: SE is triggered and records the
# next review (SRR) but its review squads are not run.
se:
  demo_stub: true

monitoring:
  console: true
  log_level: INFO

logging:
  level: DEBUG

messaging:
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}"
  topics:
    router_in: "dow.router.in"
    orchestrator_in: "dow.orchestrator.in"
    jcids_in: "dow.jcids.in"
    se_in: "dow.se.in"
    console_out: "dow.console.out"
    results: "dow.results"

object_storage:
  provider: s3
  s3:
    provider: "minio"
    endpoint_url: "${S3_ENDPOINT_URL:-http://localhost:9000}"
    access_key: "${S3_ACCESS_KEY}"
    secret_key: "${S3_SECRET_KEY}"
    region: "us-east-1"
    secure: false
  buckets:
    uploads: "dow-uploads"
    stage_outputs: "dow-stage-outputs"
    reports: "dow-reports"
    docling_out: "dow-docling-out"
    # Actual bucket JcidsOrchestrator._store_to_s3() writes results to --
    # hardcoded there today rather than read from here (see the same
    # hardcoded-vs-configured gap already flagged for Kafka topic names).
    # jcids-output is a pre-existing MinIO bucket, provisioned for this
    # exact purpose.
    results: "jcids-output"
