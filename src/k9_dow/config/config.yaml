# K9-AIF Standard Config — DoW Architecture Workbench

inference:
  llm_factory:
    backend: ollama
    provider: ollama
    base_url: "${OLLAMA_HOST:-http://localhost:11434}"
    models:
      # think: false on both aliases below -- qwen3.8:27b is a hybrid
      # reasoning model that can spend its *entire* max_tokens budget on
      # an invisible "thinking" field before any real "response" text is
      # produced. Caught live in production: CompletenessCheckerAgent's
      # call returned "Ollama responded (0 chars)" after a genuine 19s of
      # GPU work, which llm_invoke correctly turned into a hard
      # RuntimeError ("LLM backend unavailable ... No response from
      # model.") and failed the whole job. Confirmed via a direct API
      # test against the real server: num_predict=15 spent all 15 tokens
      # on "thinking" and returned an empty response with
      # done_reason="length"; think: false skips that phase and puts the
      # full budget into the actual answer instead.
      general:
        model: "qwen3.8:27b"
        temperature: 0.3
        max_tokens: 4096
        think: false
      reasoning:
        model: "qwen3.8:27b"
        temperature: 0.2
        max_tokens: 4096
        think: false
      # PackageBuilderAgent restates/consolidates every prior agent's full
      # output (readiness assessment, gap analysis, evidence summary, all
      # in prose) into one final package -- a genuinely larger synthesis
      # task than the rest of the "reasoning" alias's callers. Sharing the
      # same 4096-token ceiling truncated it mid-sentence in the final
      # deliverable handed to the human decision authority (confirmed
      # 2026-09-03 in a real FIREBIRD run). A dedicated alias with more
      # headroom on both output length and context window (its prompt is
      # also the largest of any agent's, containing the full upstream
      # payload) avoids raising the ceiling for every other reasoning call.
      #
      # think: false -- qwen3.8:27b is a hybrid reasoning model that spends
      # part of num_predict on an invisible "thinking" field before the
      # real "response" text even starts. Confirmed live against the real
      # server: num_predict=15 spent all 15 tokens thinking and returned an
      # EMPTY response with done_reason="length"; the same call with
      # think: false skipped straight to a complete answer. PackageBuilder
      # doesn't need visible reasoning, just a complete structured package
      # within budget, so this gives 100% of max_tokens to the real output.
      package_synthesis:
        model: "qwen3.8:27b"
        temperature: 0.2
        max_tokens: 8192
        num_ctx: 16384
        think: false
      guardian:
        model: "${DAS_GUARDIAN_MODEL:-granite4.1-guardian:8b}"
        temperature: 0.0
        max_tokens: 32

  router:
    type: k9_model_router
    default_model: general
    persistence:
      enabled: true
      provider: postgres

  model_catalog:
    default_model: general
    models:
      general:
        provider: ollama
        llm_ref: general
        capabilities: [general, chat, summarization]
        latency_tier: realtime
        cost_tier: minimal
      reasoning:
        provider: ollama
        llm_ref: reasoning
        capabilities: [reasoning, analysis, extraction]
        latency_tier: interactive
        cost_tier: standard
      package_synthesis:
        provider: ollama
        llm_ref: package_synthesis
        capabilities: [package_synthesis]
        latency_tier: batch
        cost_tier: standard
      guardian:
        provider: ollama
        llm_ref: guardian
        capabilities: [guardrails]
        latency_tier: interactive
        cost_tier: minimal

postgres:
  host: "${POSTGRES_HOST:-localhost}"
  port: 5432
  user: "${POSTGRES_USER:-postgres}"
  password: "${K9_PG_PASSWORD:-postgres}"
  database: "${POSTGRES_DB:-dow}"
  schema: "dow"
  echo: false

# Knowledge-corpus retrieval backend for K9Retriever (ViewGeneratorAgent).
# Without this section, K9Retriever has no VectorDB configured and its
# retrieve() calls return nothing (see view_generator_agent.py's fallback
# fix) -- this deployment seeds it with a synthetic, non-sensitive corpus
# only (prior-CDD excerpts, DoDAF reference-architecture guidance,
# acquisition review-package guidance); no real DoD data is stored here.
# See data/synthetic_corpus/README.md and experiments/seed_synthetic_corpus.py.
vectordb:
  provider: pgvector
  embedding_provider: ollama
  embedding_model: nomic-embed-text
  embedding_endpoint: "${OLLAMA_HOST:-http://localhost:11434}"
  dimension: 768
  table: dow_knowledge_corpus

# Real Guardian-backed governance (orchestrator-level, not per-agent --
# see project_k9aif_architecture_facts memory, 2026-09-03 decision, for
# why: touching all 17 agents or the shared BaseSquad framework class
# was rejected as too broad a change this close to submission).
# GuardianGovernance.post_process() reviews the assembled JCIDS package
# content via the guardian model above; the verdict is attached to the
# result for the human JROC reviewer to see, not used to auto-block the
# pipeline -- consistent with DAS's own "AI recommends, human decides"
# design throughout. enabled: false falls back to NoopGovernance exactly
# as before (K9_ENV=development, no behavior change for anyone not
# opting in).
governance:
  enabled: true
  model_alias: guardian

monitoring:
  console: true
  log_level: INFO

logging:
  level: DEBUG

messaging:
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}"
  topics:
    router_in: "dow.router.in"
    orchestrator_in: "dow.orchestrator.in"
    jcids_in: "dow.jcids.in"
    se_in: "dow.se.in"
    console_out: "dow.console.out"
    results: "dow.results"

object_storage:
  provider: s3
  s3:
    provider: "minio"
    endpoint_url: "${S3_ENDPOINT_URL:-http://localhost:9000}"
    access_key: "${S3_ACCESS_KEY}"
    secret_key: "${S3_SECRET_KEY}"
    region: "us-east-1"
    secure: false
  buckets:
    uploads: "dow-uploads"
    stage_outputs: "dow-stage-outputs"
    reports: "dow-reports"
    docling_out: "dow-docling-out"
    # Actual bucket JcidsOrchestrator._store_to_s3() writes results to --
    # hardcoded there today rather than read from here (see the same
    # hardcoded-vs-configured gap already flagged for Kafka topic names).
    # jcids-output is a pre-existing MinIO bucket, provisioned for this
    # exact purpose.
    results: "jcids-output"
