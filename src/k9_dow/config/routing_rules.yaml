# -----------------------------------------------------------
# DoW Stage-0 Router — Deterministic Rules
# Used by dow/runtime/dow_router.py
#
# FIRST MATCH WINS
# Matching is case-insensitive substring search.
# -----------------------------------------------------------

patterns:

  # ---------------------------------------------------------
  # BUSINESS DEVELOPMENT / CALL REPORTS / MEETING NOTES
  # ---------------------------------------------------------
  - name: business_meeting_notes
    classification: BD
    document_type: meeting_notes
    description: "BD call reports, engagement summaries, contracting discussions."
    contains_any:
      - "call report"
      - "meeting notes"
      - "meeting summary"
      - "post call"
      - "post-call"
      - "engagement"
      - "industry day"
      - "capture"
      - "opportunity"
      - "contracting officer"
      - "contracting poc"
      - "rfp"
      - "solicitation"
      - "proposal"
      - "market research"
      - "sources sought"
      # MSC context
      - "msc"
      - "military sealift command"
      - "ibs"
      - "aws govcloud"
      - "mymsc"
      - "hr suite"
      - "wavesight"
      - "maximo"
      - "transcom"
      - "erp+"
      - "recruitment"
      - "retention"
      - "ato"
      - "devsecops"
    route_to: business_pipeline
    dodaf_eligible: false
    jcids_eligible: false
    se_eligible: false
    recommended_stages: [1]

  # ---------------------------------------------------------
  # HR DOCUMENTS
  # ---------------------------------------------------------
  - name: hr_docs
    classification: BD
    document_type: hr_personnel_document
    description: "HR modernization, workforce, retention, hiring."
    contains_any:
      - "human resources"
      - "workforce"
      - "recruitment"
      - "retention"
      - "future workforce"
      - "leadership"
      - "hiring"
      - "training"
    route_to: business_pipeline
    dodaf_eligible: false
    jcids_eligible: false
    se_eligible: false
    recommended_stages: [1]

  # ---------------------------------------------------------
  # TECHNICAL ARCHITECTURE / DoDAF SEED DOCUMENTS
  # ---------------------------------------------------------
  - name: dodaf_architecture_docs
    classification: DODAF
    document_type: architecture_document
    description: "Mission context, OV/SV/CV/AV elements, capabilities, systems."
    contains_any:
      - "architecture"
      - "mission"
      - "capability"
      - "operational"
      - "system description"
      - "system overview"
      - "data flow"
      - "interfaces"
      - "component"
      - "conops"
      - "operational concept"
      - "ov-1"
      - "ov-2"
      - "sv-1"
      - "cv-1"
      - "dodaf"
    route_to: dodaf_pipeline
    dodaf_eligible: true
    jcids_eligible: false
    se_eligible: true
    recommended_stages: [1,2,3,4,5,6]

  # ---------------------------------------------------------
  # JCIDS REQUIREMENTS DOCUMENTS
  # ---------------------------------------------------------
  - name: jcids_requirements
    classification: JCIDS
    document_type: requirements_document
    description: "ICD, CDD, KPP, capability gaps, mission needs."
    contains_any:
      - "requirement"
      - "mission need"
      - "capability gap"
      - "initial capabilities"
      - "icd"
      - "cdd"
      - "kpp"
      - "moe"
      - "mop"
      - "jcids"
      - "dotmlpf"
    route_to: jcids_pipeline
    dodaf_eligible: true
    jcids_eligible: true
    se_eligible: true
    recommended_stages:
      - gap_analysis
      - dotmlpf
      - kpp
      - recommendations

  # ---------------------------------------------------------
  # SYSTEMS ENGINEERING DOCUMENTS
  # ---------------------------------------------------------
  - name: se_documents
    classification: SE
    document_type: se_document
    description: "SE lifecycle documents: requirements, analysis, verification."
    contains_any:
      - "systems engineering"
      - "functional analysis"
      - "design synthesis"
      - "verification"
      - "validation"
      - "system specification"
      - "interface specification"
      - "performance specification"
    route_to: se_pipeline
    dodaf_eligible: true
    jcids_eligible: false
    se_eligible: true
    recommended_stages:
      - reqs
      - functional
      - architecture
      - verification

# ---------------------------------------------------------
# DEFAULT fallback
# ---------------------------------------------------------
defaults:
  unknown:
    classification: UNKNOWN
    document_type: unknown
    route_to: business_pipeline
    dodaf_eligible: false
    jcids_eligible: false
    se_eligible: false
    recommended_stages: []