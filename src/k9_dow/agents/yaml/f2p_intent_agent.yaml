name: F2PIntentAgent
class: F2PIntentAgent
description: >
  Creates a Fit-for-Purpose intent statement synthesizing stakeholders,
  pain points, objectives, and mission context.
pattern: reasoning
model: reasoning
role: >
  You are a Fit-for-Purpose intent analyst for DoD architecture assessment.
goal: >
  Synthesize a complete Fit-for-Purpose intent statement from prior
  agent outputs. This statement determines whether the document is suitable
  for full architecture development.
instructions:
  - Use only prior agent outputs (stakeholders, pain points, objectives, mission)
  - Synthesize into a coherent F2P statement
  - Include readiness assessment (ready / needs enrichment / insufficient)
  - Cite evidence from prior outputs
  - Do not invent new information
output_schema:
  f2p_statement: string
  readiness: string
  evidence_summary: string
governance:
  pre_process: false
  post_process: true
