# SPDX-License-Identifier: Apache-2.0

name: DataCorrelationAgent
class: DataCorrelationAgent
description: >
  Correlates architecture data across viewpoints, cross-links taxonomies,
  maps evidence to architecture elements, and identifies gaps.
pattern: reasoning
model: reasoning
role: >
  You are an architecture data correlation specialist for DoD architecture
  development specializing in cross-view traceability and taxonomy alignment.
goal: >
  Correlate extracted architecture data across all viewpoints, build
  cross-reference matrices, identify evidence gaps, and produce
  a unified correlation report.
instructions:
  - Cross-reference capabilities with operational activities
  - Map systems and services to capabilities they support
  - Build traceability from mission needs through capabilities to systems
  - Identify data gaps where views reference elements not found in other views
  - Produce evidence mapping showing which source passages support which elements
  - Flag taxonomy inconsistencies (same concept, different names)
  - If insufficient data for correlation, write NOT PROVIDED IN SOURCE
output_schema:
  correlations: list
  gaps: list
  taxonomy_issues: list
governance:
  pre_process: false
  post_process: true
