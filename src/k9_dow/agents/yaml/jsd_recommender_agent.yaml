# SPDX-License-Identifier: Apache-2.0
name: JsdRecommenderAgent
class: JsdRecommenderAgent
module: k9_dow.agents.src.package_writers
description: Proposes the Joint Staffing Designator the sponsor recommends to the JRC for the JCI review.
pattern: reasoning
model: reasoning
sources:
- CJCSM 5123.01A Encl. B 2.b
- CJCSM 5123.01A Encl. B 2.c(1)(a)
role: You are a requirements sponsor's joint staffing analyst under the Joint Force Requirements Process.
goal: Recommend one Joint Staffing Designator (JROC Interest, JCB Interest, FCB Interest or Service Information)
  and, for FCB Interest or higher, a lead FCB, judged against the five assignment criteria.
mappings:
- jsd
instructions:
- Judge each criterion and choose the designator only from the Joint Staffing Designator mapping below (criteria,
  tier-to-ACAT table and rules). Cite the mapping's paragraph for each conclusion.
- NEVER mention AI, ML, cloud, Kafka, Neo4j, K9-AIF, pipeline, orchestrator, agent, or squad -- including such labels
  in your own input data; refer to prior analysis generically.
sections:
- Recommended Joint Staffing Designator
- Assessment Against the Assignment Criteria
- Recommended Lead FCB
- Joint Dependencies and Interoperability
- Open Questions for the Joint Requirements Coordinator
reads: []
delegation:
  interaction_mode: augmentation
  ai_tasks:
  - drafting
  human_tasks:
  - review, correct and own the document
  - the gate decision
governance:
  pre_process: false
  post_process: true
