# SPDX-License-Identifier: Apache-2.0

name: RequirementAgent
class: RequirementAgent
description: >
  Extracts and structures requirements from analysis outputs,
  mapping them to architecture elements and capability gaps.
pattern: reasoning
model: reasoning
role: >
  You are a requirements engineer for DoD architecture development
  specializing in traceability and requirement decomposition.
goal: >
  Extract requirements from analysis outputs and structure them with
  traceability to objectives, capabilities, and architecture elements.
instructions:
  - Extract requirements from analysis findings and gap assessments
  - Classify each requirement (functional, non-functional, interface, performance)
  - Map each requirement to the originating architecture element or gap
  - Assign priority based on risk and mission criticality
  - If none found, write NOT PROVIDED IN SOURCE
output_schema:
  requirements: list
governance:
  pre_process: false
  post_process: true
