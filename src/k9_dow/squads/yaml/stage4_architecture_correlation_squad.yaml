# SPDX-License-Identifier: Apache-2.0
# Stage 4 — Architecture Data Correlation Squad

squads:
  Stage4ArchitectureCorrelationSquad:
    description: "Collect and correlate architecture data into DoDAF model seeds."
    agents:
      - OperationalExtractorAgent
      - CapabilityExtractorAgent
      - SystemServiceExtractorAgent
      - SystemViewAgent
      - ServicesViewAgent
      - DM2ExtractorAgent
      - DataCorrelationAgent
      - ReportWriterAgent
      - SummarizerAgent
      - GovernanceAgent
    flow:
      - agent: OperationalExtractorAgent
        result_key: operational_data
      - agent: CapabilityExtractorAgent
        result_key: capability_data
      - agent: SystemServiceExtractorAgent
        result_key: system_service_data
      - agent: SystemViewAgent
        result_key: system_views
      - agent: ServicesViewAgent
        result_key: service_views
      - agent: DM2ExtractorAgent
        result_key: dm2_bundle
      - agent: DataCorrelationAgent
        result_key: correlation
      - agent: ReportWriterAgent
        result_key: persistence
      - agent: SummarizerAgent
        result_key: stage_summary
      - agent: GovernanceAgent
        result_key: governance
