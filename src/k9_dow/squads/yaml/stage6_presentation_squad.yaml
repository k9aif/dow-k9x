# Stage 6 — Presentation and Reporting Squad

squads:
  Stage6PresentationSquad:
    description: "Produce final decision-ready package. No new analysis — compile only."
    agents:
      - VerificationAgent
      - PresentationAgent
      - SummarizerAgent
      - GovernanceAgent
      - ReportWriterAgent
    flow:
      - agent: VerificationAgent
        result_key: final_validation
      - agent: PresentationAgent
        result_key: presentation
      - agent: SummarizerAgent
        result_key: executive_summary
      - agent: GovernanceAgent
        result_key: governance_signoff
      - agent: ReportWriterAgent
        result_key: final_reports
